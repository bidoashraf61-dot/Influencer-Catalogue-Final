# Publishes the catalogue to GitHub Pages on every push to main.
#
# The repo root IS the site: index.html is the roster, selection/ is one
# shortlist, assets/ holds only what those two pages reference. Nothing else
# is served — an earlier deploy published the whole HelloVoice site and
# visitors landed on the homepage instead of the catalogue.
name: Deploy catalogue to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
