# Publishes site/ to GitHub Pages on every push to main.
#
# Pages serves the repo under /<repo-name>/, not the domain root, so every
# asset link in the catalogue is relative rather than root-absolute. Do not
# "tidy" those back to /assets/... — the page loads unstyled if you do.
name: Deploy catalogue to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
