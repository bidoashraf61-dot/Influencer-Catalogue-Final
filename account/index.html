<body data-page="account">
<!--
HELVi Connect: the client's profile, a full page for signed-in account holders.
White bar with the HELVi Connect logo, then a side nav (tabs on a phone):
Overview, Selections, Analyses, Campaigns, Briefs, Notifications, Credits, Account.
Everything below the bar is drawn by assets/js/account.js from /api/account.
Approved design: .impeccable/mockups/portal-v3/ (2026-10-09).
-->

<header class="hc-bar">
  <div class="cat-pad"><div class="cat-container cat-topbar hc-bar__in">
    <a class="hc-mark" href="../" aria-label="HELVi Connect, back to the catalogue">
      <img class="hc-mark__logo" src="../assets/brand/helvy-connect/helvy-connect-light-320.webp?v=c5" srcset="../assets/brand/helvy-connect/helvy-connect-light-320.webp?v=c5 1x, ../assets/brand/helvy-connect/helvy-connect-light-640.webp?v=c5 2x" alt="HELVi Connect" width="320" height="160"/>
      <span class="hc-mark__tag">Connecting Brands with the Right Voices</span>
    </a>
    <div class="cat-topbar__links">
      <a class="hc-link hc-link--hide" href="../">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        Catalogue
      </a>
      <a class="cat-track hc-track" href="../campaign/dashboard/" aria-label="Campaign tracking">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
        <span>Campaign tracking</span>
      </a>
    </div>
  </div></div>
</header>

<main class="hc-main" id="ac-main">
  <div class="cat-pad"><div class="cat-container">
    <div class="ac-loading" id="ac-loading" role="status">Loading your profile…</div>
    <div class="ac-closed" id="ac-closed" hidden></div>
    <div class="hc-acc" id="hc-acc" hidden>
      <aside class="hc-side" id="hc-side" aria-label="Your profile"></aside>
      <div class="hc-body" id="hc-body" tabindex="-1"></div>
    </div>
  </div></div>
</main>

<div class="hc-toast" id="hc-toast" role="status" aria-live="polite" hidden></div>

<footer class="hc-foot">
  <div class="cat-pad"><div class="cat-container hc-foot__in">
    <img class="hc-foot__logo" src="../assets/brand/helvy-connect/helvy-connect-dark-320.webp?v=c5" srcset="../assets/brand/helvy-connect/helvy-connect-dark-320.webp?v=c5 1x, ../assets/brand/helvy-connect/helvy-connect-dark-640.webp?v=c5 2x" alt="HELVi Connect" width="320" height="160"/>

    <span class="hc-foot__legal"><a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a></span>
  </div></div>
</footer>
