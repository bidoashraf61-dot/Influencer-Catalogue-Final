<body class="cat-locked" data-page="creator">
<!--
THESIS: A creator's full analysis as a talent passport — an identity data
page, then stamped pages for where their audience lives, how real it is, how
it grew and what they post — refusing the tabbed analytics dashboard.
OWN-WORLD: Catalogue world: linen data page on white, ink cover, Bebas Neue
fields, DM Sans values; audience countries as rotated, double-ruled stamps
with real flags; lime seal for "analysed", ink seal for "locked".
STORY: A brand manager sees who this creator is, whether the audience is
real and in their market, and how they perform against their tier — or
requests the analysis when it is not on file yet.
FIRST VIEWPORT: Data page — photo, name, code, tier, handles with platform
marks, seal; the key numbers strip beneath it.
FORM: talent passport, structure 5 of 7, seed c4bd3e93.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<div class="cat-gate" id="cat-gate" hidden>
  <div class="cat-gate__inner">
    <img class="cat-gate__logo" src="../assets/brand/logo-knockout.webp" alt="HelloVoice"/>
    <p class="cat-gate__eyebrow">Confidential</p>
    <h1 class="cat-gate__title">Creator analysis</h1>
    <p class="cat-gate__note">Enter the access code you were given.</p>
    <form class="cat-gate__form" id="cat-gate-form" autocomplete="off">
      <input type="password" id="cat-code" class="cat-gate__input" placeholder="Access code"
             aria-label="Access code" autocomplete="off" spellcheck="false"/>
      <button type="submit" class="cat-btn cat-btn--lime">Unlock</button>
    </form>
    <p class="cat-gate__error" id="cat-gate-error" role="alert" hidden>That code is not right.</p>
  </div>
</div>

<main class="cat-app pp" id="cat-app" hidden>
  <nav class="pp-top cat-pad" aria-label="Page navigation">
    <div class="cat-container pp-top__in">
      <a href="../"><img class="pp-top__logo" src="../assets/brand/logo.png" alt="HelloVoice — back to the catalogue"/></a>
      <div class="pp-top__links">
        <a class="pp-link" href="../" id="pp-back">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Back
        </a>
        <a class="pp-link" href="../">Full catalogue</a>
        <a class="pp-link" href="../campaign/dashboard/">My campaigns</a>
      </div>
    </div>
  </nav>

  <div class="cat-pad"><div class="cat-container">
    <!-- the data page -->
    <section class="pp-id" id="pp-id" aria-label="Creator identity"></section>
    <!-- one tab per platform: Instagram, TikTok… -->
    <nav class="pp-plat" id="pp-plat" role="tablist" aria-label="Analysis by platform" hidden></nav>
    <!-- locked: no analysis on file -->
    <section class="pp-sealed" id="pp-sealed" hidden></section>
    <!-- the analysis pages -->
    <div id="pp-pages" hidden>
      <section class="pp-page" aria-labelledby="pp-h-posts" id="pp-posts-sec">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-posts">Popular posts</h2></header>
        <div id="pp-posts"></div>
      </section>
      <section class="pp-page" aria-labelledby="pp-h-real" id="pp-real-sec">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-real">Followers</h2></header>
        <div id="pp-real"></div>
      </section>
      <section class="pp-page" aria-labelledby="pp-h-perf">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-perf">Content</h2><div class="pp-tabs" id="pp-perf-tabs" role="tablist" aria-label="Content type"></div></header>
        <div id="pp-perf"></div>
      </section>
      <section class="pp-page" aria-labelledby="pp-h-net" id="pp-net-sec">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-net">Creator brand affinity &amp; interests</h2></header>
        <div id="pp-net"></div>
      </section>
      <section class="pp-page" aria-labelledby="pp-h-aud" id="pp-aud-sec">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-aud">Audience data</h2><div class="pp-tabs" id="pp-aud-tabs" role="tablist" aria-label="Audience of"></div></header>
        <div id="pp-aud"></div>
      </section>
      <section class="pp-page" aria-labelledby="pp-h-tags" id="pp-tags-sec">
        <header class="pp-head"><h2 class="pp-h2" id="pp-h-tags">Popular hashtags &amp; mentions</h2></header>
        <div id="pp-tags"></div>
      </section>
      <p class="pp-source" id="pp-source"></p>
    </div>
  </div></div>
  <p class="pp-empty" id="pp-empty" hidden></p>
</main>

<div class="pp-modal" id="pp-modal" hidden role="dialog" aria-modal="true" aria-label="Post">
  <div class="pp-modal__box">
    <button type="button" class="pp-modal__close" id="pp-modal-close" aria-label="Close">&times;</button>
    <div class="pp-modal__frame" id="pp-modal-frame"></div>
    <a class="pp-btn pp-btn--ink pp-modal__open" id="pp-modal-open" href="#" target="_blank" rel="noopener">Open on Instagram</a>
  </div>
</div>

<script>
  window.CREATOR_CONFIG = { api: "/admin" };
</script>
<script src="../assets/js/hv-icons.js?v=f1325cf5"></script>

</body>
</html>
