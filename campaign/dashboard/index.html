<body class="cat-locked" data-page="campaign">
<!--
THESIS: The campaign on one screen — a control-room dashboard of cards, each
a single answer with a "More" door into its detail — refusing the long scroll.
OWN-WORLD: The catalogue world compressed: white board, linen KPI strip,
Bebas figures, DM Sans labels, lime for selection, the brand's four data
colours (green, orange, lime-dark, warm grey), verdict pills only for verdicts,
drawn platform marks and real flags.
STORY: The client sees in one glance whether the campaign is on track and why,
narrows it by platform, dates or creators, and opens any card for the detail.
FIRST VIEWPORT: Header with brand, name, LIVE state, verdict and filters; the
objective bar and six KPI cards; then two rows of cards filling the screen.
FORM: single-screen dashboard grid with slide-in detail panels.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<div class="cat-gate" id="cat-gate" hidden>
  <div class="cat-gate__inner">
    <img class="cat-gate__logo" src="../../assets/brand/helvy-connect/helvy-connect-dark-320.webp?v=c5" srcset="../../assets/brand/helvy-connect/helvy-connect-dark-320.webp?v=c5 1x, ../../assets/brand/helvy-connect/helvy-connect-dark-640.webp?v=c5 2x" alt="HELVi Connect" width="320" height="160"/>
    <!-- No access-code form (item 181): portal.js draws the email sign-in here. -->
    <p class="cat-gate__note" id="cat-gate-note" role="status" hidden></p>
  </div>
</div>

<main class="cat-app db" id="cat-app" hidden>
  <header class="db-head">
    <a href="../../" class="db-head__logo"><img src="../../assets/brand/modules/helvi-track-logo-v3.png" alt="Helvi Track — back to the catalogue" width="620" height="320"/></a>
    <div class="db-head__brands" id="db-brands"></div>
    <div class="db-head__title">
      <div class="db-head__row"><h1 id="db-title">Campaign</h1><div class="db-head__verdict" id="db-verdict"></div></div>
      <p id="db-sub"></p>
    </div>
    <div class="db-head__actions">
      <a class="db-btn" id="db-all" href="../#list" hidden>All campaigns</a>
      <a class="db-btn" id="db-report" href="../">Full report</a>
      <a class="db-btn db-btn--lime" id="db-pdf" href="../">Download PDF</a>
    </div>
  </header>

  <nav class="db-filters" aria-label="Filters">
    <div class="db-seg" id="db-platforms" role="group" aria-label="Platform"></div>
    <div class="db-filter">
      <label for="db-range">Dates</label>
      <select id="db-range">
        <option value="all">Whole campaign</option>
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="custom">Custom…</option>
      </select>
      <span class="db-custom" id="db-custom" hidden>
        <input type="date" id="db-from" aria-label="From"/> – <input type="date" id="db-to" aria-label="To"/>
      </span>
    </div>
    <div class="db-filter db-pick">
      <span class="db-filter__lbl" id="db-creators-lbl">Creators</span>
      <button type="button" class="db-pick__btn" id="db-creators-btn" aria-expanded="false" aria-controls="db-creators" aria-describedby="db-creators-lbl">All creators</button>
      <div class="db-pick__menu" id="db-creators" hidden></div>
    </div>
    <p class="db-fresh" id="db-fresh"></p>
  </nav>

  <div class="db-grid" id="db-grid">
    <section class="db-card db-objective" data-area="obj" id="w-objective"></section>
    <section class="db-kpis" id="w-kpis" aria-label="Key numbers"></section>
    <section class="db-card db-trend" id="w-trend"></section>
    <section class="db-card db-top" id="w-top"></section>
    <section class="db-card db-stage" id="w-stage"></section>
    <section class="db-card db-mix" id="w-mix"></section>
    <section class="db-card db-did" id="w-did"></section><!-- What people did ring (2026-10-23) -->
    <section class="db-card db-geo" id="w-geo"></section>
    <section class="db-card db-plat" id="w-plat"></section>
    <section class="db-card db-clicks" id="w-clicks"></section>
    <section class="db-card db-posts" id="w-posts"></section>
  </div>
</main>

<!-- detail panel -->
<div class="db-scrim" id="db-scrim" hidden></div>
<aside class="db-panel" id="db-panel" role="dialog" aria-modal="true" aria-labelledby="db-panel-title" hidden>

    <h2 id="db-panel-title"></h2>
    <button type="button" class="db-panel__close" id="db-panel-close" aria-label="Close">

    </button>
  </header>
  <div class="db-panel__body" id="db-panel-body"></div>
</aside>
