<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex"/>
<meta name="referrer" content="no-referrer"/>
<title>Campaign report — HelloVoice</title>
<link rel="icon" href="../assets/icons/icon-32.png" type="image/png"/>
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css"/>
<link rel="stylesheet" href="../assets/css/catalogue.css?v=1"/>
<link rel="stylesheet" href="../assets/css/campaign.css?v=1"/>
</head>
<body class="cat-locked" data-page="campaign">
<!--
THESIS: A campaign report that reads like a live match-day results package —
status ticker, highlights first, a league table with medals, stat graphics
judged against benchmarks — refusing the generic grid of KPI tiles.
OWN-WORLD: The catalogue's world: Bebas Neue display, DM Sans body, ink
broadcast bars with lime type, linen bands, lime rotated pill; signal colours
green / orange / red only for verdicts; drawn platform marks; flags as images.
STORY: The client sees at once whether the campaign is on track, then the
posts that made it, who led, how each number compares with its benchmark,
and what the affiliate links drove; then downloads it.
FIRST VIEWPORT: Ink scorebug with brand logos, title, LIVE ticker and verdict
stamp; scope-of-work timeline directly beneath.
FORM: match-day broadcast results package, structure 6 of 7, seed 2d08ada4.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<div class="cat-gate" id="cat-gate" hidden>
  <div class="cat-gate__inner">
    <img class="cat-gate__logo" src="../assets/brand/logo-knockout.webp" alt="HelloVoice"/>
    <p class="cat-gate__eyebrow">Confidential</p>
    <h1 class="cat-gate__title">Campaign report</h1>
    <p class="cat-gate__note">Enter the access code you were given.</p>
    <form class="cat-gate__form" id="cat-gate-form" autocomplete="off">
      <input type="password" id="cat-code" class="cat-gate__input" placeholder="Access code"
             aria-label="Access code" autocomplete="off" spellcheck="false"/>
      <button type="submit" class="cat-btn cat-btn--lime">Unlock</button>
    </form>
    <p class="cat-gate__error" id="cat-gate-error" role="alert" hidden>That code is not right.</p>
  </div>
</div>

<main class="cat-app mx" id="cat-app" hidden>

  <nav class="mx-top cat-pad" aria-label="Report navigation">
    <div class="cat-container mx-top__in">
      <a href="../" class="mx-top__logo"><img src="../assets/brand/logo.png" alt="HelloVoice — back to the catalogue"/></a>
      <div class="mx-top__links">
        <a class="mx-link" href="../" id="mx-catalogue">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Full catalogue
        </a>
        <a class="mx-link" href="#list" id="mx-all" hidden>All campaigns</a>
        <a class="cat-portfolio" href="https://hellovoice.co.uk" target="_blank" rel="noopener">Portfolio
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- the passcode's campaigns -->
  <section class="mx-list cat-pad" id="mx-list" hidden>
    <div class="cat-container">
      <h1 class="cat-hero__title mx-list__title">My campaigns</h1>
      <div class="mx-list__items" id="mx-list-items"></div>
    </div>
  </section>

  <div id="mx-report" hidden>
    <!-- scorebug: who, what, live state, verdict -->
    <header class="mx-bug">
      <div class="cat-pad"><div class="cat-container">
        <div class="mx-bug__brands" id="mx-brands"></div>
        <h1 class="mx-bug__title" id="mx-title"></h1>
        <p class="mx-bug__sub" id="mx-sub"></p>
        <div class="mx-bug__row">
          <p class="mx-ticker" id="mx-ticker"></p>
          <div class="mx-verdict" id="mx-verdict"></div>
        </div>
        <dl class="mx-score-line" id="mx-scoreline"></dl>
        <div class="mx-delivery" id="mx-delivery"></div>
      </div></div>
    </header>

    <!-- the scope of work, step by step: right under the header -->
    <section class="mx-sec mx-sec--progress cat-pad" aria-labelledby="mx-h-progress">
      <div class="cat-container">
        <div class="mx-sec__head">
          <h2 class="mx-h2" id="mx-h-progress">Campaign progress</h2>
          <p class="mx-status__dates" id="mx-dates"></p>
        </div>
        <p class="mx-note" id="mx-note" hidden></p>
        <div class="mx-gantt" id="mx-gantt"></div>
      </div>
    </section>

    <!-- the posts, first -->
    <section class="mx-sec cat-pad" aria-labelledby="mx-h-posts">
      <div class="cat-container">
        <div class="mx-sec__head">
          <h2 class="mx-h2" id="mx-h-posts">Highlights</h2>
          <div class="mx-filters" id="mx-filters" role="toolbar" aria-label="Filter posts"></div>
        </div>
        <div class="mx-wall" id="mx-wall"></div>
      </div>
    </section>

    <!-- league table -->
    <section class="mx-sec mx-sec--ink cat-pad" aria-labelledby="mx-h-board">
      <div class="cat-container">
        <div class="mx-sec__head">
          <h2 class="mx-h2" id="mx-h-board">Leaderboard</h2>
        </div>
        <div class="mx-podium" id="mx-podium"></div>
        <div class="mx-table-wrap"><table class="mx-table" id="mx-table"></table></div>
      </div>
    </section>

    <!-- targets and benchmarks -->
    <section class="mx-sec cat-pad" aria-labelledby="mx-h-targets">
      <div class="cat-container">
        <div class="mx-sec__head">
          <h2 class="mx-h2" id="mx-h-targets">Against target</h2>
          <p class="mx-sec__lede" id="mx-targets-lede"></p>
        </div>
        <div class="mx-bullets" id="mx-bullets"></div>
        <div class="mx-bench" id="mx-bench"></div>
      </div>
    </section>

    <!-- performance graphics -->
    <section class="mx-sec mx-sec--linen cat-pad" aria-labelledby="mx-h-perf">
      <div class="cat-container">
        <div class="mx-sec__head"><h2 class="mx-h2" id="mx-h-perf">How it grew</h2></div>
        <div class="mx-charts" id="mx-charts"></div>
        <div class="mx-mix" id="mx-mix"></div>
      </div>
    </section>

    <!-- affiliate links -->
    <section class="mx-sec cat-pad" aria-labelledby="mx-h-clicks" id="mx-clicks-sec">
      <div class="cat-container">
        <div class="mx-sec__head">
          <h2 class="mx-h2" id="mx-h-clicks">Affiliate link clicks</h2>
        </div>
        <div id="mx-clicks"></div>
      </div>
    </section>

    <section class="mx-end cat-pad">
      <div class="cat-container mx-end__in">
        <button type="button" class="cat-btn cat-btn--lime" id="mx-print">Download PDF</button>
        <a class="cat-btn mx-btn-line" id="mx-csv" href="#">Download CSV</a>
        <a class="cat-btn mx-btn-line" href="../">Back to the catalogue</a>
      </div>
    </section>
  </div>

  <p class="mx-empty" id="mx-empty" hidden></p>
</main>

<script>
  window.CAMPAIGN_CONFIG = { api: "/admin" };
</script>
<script src="../assets/js/hv-icons.js?v=1"></script>
<script src="../assets/js/campaign.js?v=1"></script>
</body>
</html>
