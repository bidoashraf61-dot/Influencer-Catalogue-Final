# HelloVoice — influencer catalogue (influencer-catalogue.hellovoice.co.uk)
#
# The repo root IS the site: / is the roster, /selection/ is one shortlist.
# An earlier deploy published the whole HelloVoice site, so visitors landed on
# the marketing homepage instead of the catalogue — hence the trimmed repo.
#
# The page's own passcode is client-side only (see docs/CATALOGUE.md upstream);
# nothing here enforces it. The creator photographs are a different matter: they
# are signed now, and checked below.

# ---- the thumbnailer -----------------------------------------------------
# Bound to loopback inside the container, so it is reachable only from the
# server block below and never from outside. It exists because image_filter
# rewrites a response body, and we want the resized result cached rather than
# recomputed for every visitor — which needs a proxy hop to cache across.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location /src/ {
        alias /usr/share/nginx/html/assets/catalogue/;

        # 96px wide, height to match. The dashboard draws these at 44px, so
        # this is still a retina-sharp source, and the whole set comes to
        # 2.2MB instead of the 18.9MB the full-size originals cost.
        image_filter resize 96 -;
        image_filter_jpeg_quality 80;

        # Refuses anything bigger rather than trying to decode it. The largest
        # photo on file is 2.2MB (3072x4096), and a malformed or enormous
        # upload must not be able to exhaust the container.
        image_filter_buffer 4M;
    }
}

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # TLS is terminated by nginx-proxy-manager, so $scheme here is http.
    # Emit relative redirects and let the browser keep the https origin.
    absolute_redirect off;

    # Trust the proxy in front of us for client IPs in the access log
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # ---- security headers, applied to every response ---------------------
    # The roster is client data, not public marketing: keep it out of indexes.
    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "no-referrer"                  always;

    # ---- creator thumbnails ----------------------------------------------
    # The dashboard's roster. Signed by the admin service, resized and checked
    # here, so that a page with 757 pictures on it costs the Python process
    # nothing at all. ^~ so the js/css regex below cannot steal it.
    location ^~ /thumb/ {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$photo_secret";

        # "" is a bad or missing signature, "0" is a good one that has expired.
        # Both are a plain refusal: saying which would help someone guessing.
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 403; }

        proxy_cache       thumbs;
        proxy_cache_key   "$uri";
        proxy_cache_valid 200 90d;
        proxy_cache_valid 404 415 1m;
        proxy_pass        http://127.0.0.1:8081/src/;

        # private: these are client data and must not be held by a shared
        # cache. A day matches how long the signature stays the same, so the
        # browser can reuse the file for as long as the URL is stable.
        add_header Cache-Control "private, max-age=86400"              always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive"         always;
        add_header X-Content-Type-Options "nosniff"                    always;
    }

    # ---- creator photographs, full size ----------------------------------
    # Every code is HV-XX-NNN, so the whole set used to be walkable by anyone
    # who guessed the pattern — no passcode, no cookie, nothing. A link is now
    # good only if the admin service signed it, and only for about a day.
    location ^~ /assets/catalogue/ {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$photo_secret";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 403; }

        add_header Cache-Control "private, max-age=86400"              always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive"         always;
        add_header X-Content-Type-Options "nosniff"                    always;
        try_files $uri =404;
    }

    # ---- long-lived assets ------------------------------------------------
    # Cache-busted by ?v= query strings in the built pages.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # ---- js/css must revalidate ------------------------------------------
    # The dist build drops the ?v= cache-buster that the source templates
    # carry, so catalogue.js lives at a URL that never changes. Serving it
    # "immutable" for 30 days pinned every returning client to whatever build
    # they first loaded: on 2026-09-08 a browser was still splitting no
    # interests and showing "Fashion, Lifestyle, ..." as one chip while the
    # server had the fixed file. "no-cache" still stores the file — it just
    # revalidates, so an unchanged build costs a 304, and a new one lands at
    # once. Must sit before /assets/: regex locations win over prefixes.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache"                           always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive"        always;
        add_header X-Frame-Options "SAMEORIGIN"                       always;
        add_header Referrer-Policy "no-referrer"                      always;
        try_files $uri =404;
    }

    # ---- the previous layout served the catalogue one level down ---------
    # Links handed out before the root-level redeploy still work. Fragments
    # are client-side, so a shortlist link keeps its selection across the hop.
    location = /catalogue/ { return 301 /; }
    location = /catalogue/selection/ { return 301 /selection/; }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---- the two catalogue pages -----------------------------------------
    # Never cached: the passcode gate and the roster both live in the HTML,
    # so a stale copy in a client's browser outlives a rebuild.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header Referrer-Policy        "no-referrer"                  always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---- never serve dotfiles --------------------------------------------
    # .nojekyll is a GitHub Pages marker and means nothing to nginx.
    location ~ /\. {
        deny all;
    }
}
