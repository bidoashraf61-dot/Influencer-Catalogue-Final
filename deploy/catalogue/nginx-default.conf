# HelloVoice — influencer catalogue (influencer-catalogue.hellovoice.co.uk)
#
# The repo root IS the site: / is the roster, /selection/ is one shortlist.
# An earlier deploy published the whole HelloVoice site, so visitors landed on
# the marketing homepage instead of the catalogue — hence the trimmed repo.
#
# The page's own passcode is client-side only (see docs/CATALOGUE.md upstream);
# nothing here enforces it.

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # TLS is terminated by nginx-proxy-manager, so $scheme here is http.
    # Emit relative redirects and let the browser keep the https origin.
    absolute_redirect off;

    # Trust the proxy in front of us for client IPs in the access log
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # ---- security headers, applied to every response ---------------------
    # The roster is client data, not public marketing: keep it out of indexes.
    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "no-referrer"                  always;

    # ---- long-lived assets ------------------------------------------------
    # Cache-busted by ?v= query strings in the built pages.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # ---- js/css must revalidate ------------------------------------------
    # The dist build drops the ?v= cache-buster that the source templates
    # carry, so catalogue.js lives at a URL that never changes. Serving it
    # "immutable" for 30 days pinned every returning client to whatever build
    # they first loaded: on 2026-09-08 a browser was still splitting no
    # interests and showing "Fashion, Lifestyle, ..." as one chip while the
    # server had the fixed file. "no-cache" still stores the file — it just
    # revalidates, so an unchanged build costs a 304, and a new one lands at
    # once. Must sit before /assets/: regex locations win over prefixes.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache"                           always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive"        always;
        add_header X-Frame-Options "SAMEORIGIN"                       always;
        add_header Referrer-Policy "no-referrer"                      always;
        try_files $uri =404;
    }

    # ---- the previous layout served the catalogue one level down ---------
    # Links handed out before the root-level redeploy still work. Fragments
    # are client-side, so a shortlist link keeps its selection across the hop.
    location = /catalogue/ { return 301 /; }
    location = /catalogue/selection/ { return 301 /selection/; }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---- the two catalogue pages -----------------------------------------
    # Never cached: the passcode gate and the roster both live in the HTML,
    # so a stale copy in a client's browser outlives a rebuild.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header Referrer-Policy        "no-referrer"                  always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---- never serve dotfiles --------------------------------------------
    # .nojekyll is a GitHub Pages marker and means nothing to nginx.
    location ~ /\. {
        deny all;
    }
}
