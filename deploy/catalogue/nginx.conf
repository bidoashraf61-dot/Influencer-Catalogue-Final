# Main nginx configuration for the catalogue container.
#
# The stock nginx.conf from the image would do, except for two things that can
# only be said at this level: load_module, and the cache pool the thumbnailer
# writes into. Both exist so that nginx — not the Python admin service — is what
# answers a request for a creator's photograph.
#
# Serving 757 thumbnails from the admin service put 757 requests into a process
# that handles one at a time, and a save that took 17ms on a quiet server took
# up to three seconds behind them. Measured 2026-09-09.

load_module modules/ngx_http_image_filter_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Resized thumbnails, kept so each source photo is decoded once rather than
    # once per visitor. It is inside the container and so is thrown away on a
    # restart; that costs one slow first page and nothing else. 128m is far more
    # than the whole set needs — 758 photos came to 6.2MB resized.
    proxy_cache_path /var/cache/nginx/thumbs levels=1:2 keys_zone=thumbs:4m
                     max_size=128m inactive=90d use_temp_path=off;

    # $photo_secret, the key the signed photo links are checked against. It is
    # written by update.sh from admin/.photo-secret and is deliberately NOT in
    # git — this repository is public, and the key in it would make every signed
    # link forgeable. If nginx will not start saying $photo_secret is unknown,
    # this file is missing: run update.sh, which writes it.
    include /etc/nginx/secret.conf;

    include /etc/nginx/conf.d/*.conf;
}
