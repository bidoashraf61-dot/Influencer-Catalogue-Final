services:
  catalogue:
    image: nginx:alpine
    container_name: influencer-catalogue
    restart: always
    ports:
      # Local troubleshooting only. Public access is via nginx-proxy-manager.
      - "127.0.0.1:1012:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      # nginx.conf, not just conf.d: load_module and the thumbnail cache pool
      # can only be declared in the main context.
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      # The photo-link signing key. Written by update.sh, never in git.
      - ./conf/secret.conf:/etc/nginx/secret.conf:ro
      - ./logs:/var/log/nginx
    networks:
      - default
      - proxy
    deploy:
      resources:
        limits:
          # Raised from 64M for the thumbnailer: decoding the largest photo on
          # file (3072x4096) takes real memory, and twelve at once peaked at
          # 47MB in testing. It idles at about 12MB.
          memory: 192M
        reservations:
          memory: 16M

networks:
  # Same pattern as hellovoice-board: join NPM's network so the proxy can
  # reach this container by name.
  proxy:
    external: true
    name: nginx-proxy-manager_default
